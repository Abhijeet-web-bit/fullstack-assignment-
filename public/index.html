<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Task Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <h2>📋 Task Tracker</h2>
  <div style="display:flex; align-items:center; gap:12px;">
    <span class="user-info" id="userInfo"></span>
    <button class="btn btn-small btn-secondary" id="logoutBtn">Logout</button>
  </div>
</div>

<div class="container">
  <div class="toolbar">
    <select id="statusFilter">
      <option value="">All Statuses</option>
      <option value="pending">Pending</option>
      <option value="in-progress">In Progress</option>
      <option value="completed">Completed</option>
    </select>
  </div>

  <div class="task-grid" id="taskGrid"></div>
</div>

<button class="fab" id="addTaskBtn">+</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">New Task</h3>
    <form id="taskForm">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="Task title">
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Optional details"></textarea>
      </div>
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status">
          <option value="pending">Pending</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="form-group">
        <label for="due_date">Due Date</label>
        <input type="date" id="due_date">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
