<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Task Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Sign up to start tracking your tasks</p>
    <div class="error-msg" id="errorMsg"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" placeholder="johndoe">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
